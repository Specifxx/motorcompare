name: Fitment probe

# Research only: samples the biggest AU Shopify stores (where robots.txt allows /products.json) to see how, if at all,
# they state fitment (tags, description tables, make and model words). Commits probe/fitment-out.json and
# probe/fitment-summary.md to the claude/* branch it ran on. Never touches data/ or main.

on:
  push:
    branches: ["claude/**"]
    paths: ["probe/fitment.mjs", ".github/workflows/probe-fitment.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node probe/fitment.mjs
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/fitment-out.json probe/fitment-summary.md
          git commit -m "probe: fitment sample" || exit 0
          for i in 1 2 3; do git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break; sleep 5; done
