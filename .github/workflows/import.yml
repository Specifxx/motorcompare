name: Import prices

# The daily import: every store → data/public → eBay (budgeted, off until its
# keys exist) → commit to main. The data commit's SUBJECT carries [deploy], so
# it is the day's one production build (scripts/vercel-ignore-build.sh).

on:
  schedule:
    - cron: "11 6 * * *"
  workflow_dispatch:
    inputs:
      ebay:
        description: "Spend eBay calls this run"
        type: boolean
        default: true
      stores:
        description: "Re-read every store first (off = an eBay-only run on today's products, minutes not hours)"
        type: boolean
        default: true

concurrency:
  group: import-prices
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # The stores with no product feed (platform "pages"): eight runners read
  # their product pages (scripts/read-pages.ts) in parallel, about a page a
  # second each, and hand the import job each store's state.
  pages:
    if: github.event_name != 'workflow_dispatch' || inputs.stores
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/read-pages.ts
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 8
          MINUTES: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-${{ matrix.shard }}
          path: pages-out/
          if-no-files-found: ignore
          retention-days: 3

  import:
    needs: pages
    # Also when a page job failed or was skipped (an eBay-only run): those stores keep their last state.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        if: github.event_name != 'workflow_dispatch' || inputs.stores
        continue-on-error: true
        with:
          pattern: pages-*
          merge-multiple: true
          path: data/state/pages/
      - name: Stores
        if: github.event_name != 'workflow_dispatch' || inputs.stores
        run: npx tsx scripts/import.ts
      - name: Partner feeds (Stylevana through Awin; every run, eBay-only ones too; a no-op until its secret exists)
        env:
          AWIN_FEED_STYLEVANA: ${{ secrets.AWIN_FEED_STYLEVANA }}
        run: npx tsx scripts/partner-feeds.ts
      - name: eBay
        if: github.event_name != 'workflow_dispatch' || inputs.ebay
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_DAILY_CAP: ${{ vars.EBAY_DAILY_CAP }}
        run: npx tsx scripts/ebay-import.ts
      - name: Amazon ASINs (by barcode; a no-op until a Creators API credential exists)
        # Also on an eBay-only run: it reads today's products and needs no store pass.
        env:
          AMAZON_CREATORS_US_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_US_CLIENT_ID }}
          AMAZON_CREATORS_US_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_US_CLIENT_SECRET }}
          AMAZON_CREATORS_US_VERSION: ${{ secrets.AMAZON_CREATORS_US_VERSION }}
          AMAZON_CREATORS_UK_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_UK_CLIENT_ID }}
          AMAZON_CREATORS_UK_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_UK_CLIENT_SECRET }}
          AMAZON_CREATORS_UK_VERSION: ${{ secrets.AMAZON_CREATORS_UK_VERSION }}
          AMAZON_CREATORS_CA_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CA_CLIENT_ID }}
          AMAZON_CREATORS_CA_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CA_CLIENT_SECRET }}
          AMAZON_CREATORS_CA_VERSION: ${{ secrets.AMAZON_CREATORS_CA_VERSION }}
          AMAZON_CREATORS_EU_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_EU_CLIENT_ID }}
          AMAZON_CREATORS_EU_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_EU_CLIENT_SECRET }}
          AMAZON_CREATORS_EU_VERSION: ${{ secrets.AMAZON_CREATORS_EU_VERSION }}
          AMAZON_CREATORS_AU_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_AU_CLIENT_ID }}
          AMAZON_CREATORS_AU_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_AU_CLIENT_SECRET }}
          AMAZON_CREATORS_AU_VERSION: ${{ secrets.AMAZON_CREATORS_AU_VERSION }}
        run: npx tsx scripts/amazon-asins.ts
      - name: Reviews (published ratings → data/public/reviews.json)
        env:
          # The reviews branch of this public repo, read with the job's own token (no secret).
          REVIEWS_GITHUB_TOKEN: ${{ github.token }}
        run: npx tsx scripts/reviews-export.ts
      - name: Commit data (this commit is the daily release)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: daily prices $(date -u +%F) [deploy]" -m "Written by import.yml. This is the one scheduled production build a day."
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            sleep $((2 ** i)); git pull --rebase origin main
          done
          exit 1
      - name: IndexNow
        if: success()
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
        run: npx tsx scripts/indexnow-submit.ts || true
